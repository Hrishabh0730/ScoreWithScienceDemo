# Supabase free projects pause after ~7 days without database activity.
# This pings a page that queries the database once a day so the site never goes to sleep.
# Set the repository variable SITE_URL (Settings → Secrets and variables → Actions → Variables).
name: Keep Supabase awake
on:
  schedule:
    - cron: "17 3 * * *" # daily, 08:47 IST
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping site
        run: curl -fsS "${{ vars.SITE_URL }}/api/slots?service=doubt" > /dev/null
